<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Translate Demo — Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{background:#0b0f17}</style>
</head>
<body class="min-h-screen flex items-center justify-center text-slate-200">
  <form method="post" action="/login"
        class="w-full max-w-sm bg-slate-900/70 backdrop-blur rounded-2xl shadow-xl p-8 border border-slate-800">
    <h1 class="text-2xl font-semibold mb-1">Translate</h1>
    <p class="text-slate-400 text-sm mb-6">Medical document translation pipeline — demo</p>
    {% if error %}
    <div class="mb-4 px-3 py-2 rounded bg-red-900/40 border border-red-700 text-red-200 text-sm">
      Invalid password.
    </div>
    {% endif %}
    <label class="block text-sm text-slate-300 mb-1" for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus
           class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 focus:border-sky-500 focus:outline-none" />
    <button type="submit"
            class="mt-6 w-full bg-sky-600 hover:bg-sky-500 transition px-4 py-2 rounded-lg font-medium">
      Continue
    </button>
  </form>
</body>
</html>
